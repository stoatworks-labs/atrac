  <body>
    <main id="demo">
      <noscript>
        <h1>Atrac</h1>
        <p>
          An FFGL effect that runs the picture through a coder modelled on
          MiniDisc's ATRAC: a lapped transform on overlapping blocks,
          coefficients grouped into block floating units with a scale factor and
          a word length each, and a fixed budget of bits per block shared out by
          a masking model. Fine texture goes first, hard edges ring one block
          either side, the allocation shimmers from frame to frame, and a knock
          (an audio onset, or the button) drains the shock-proof buffer until
          the picture freezes.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/atrac">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/atrac/">Project page and downloads</a></li>

        </ul>
